<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local gallery interaction test</title>
<link rel="stylesheet" href="../../../hillside.css"><link rel="stylesheet" href="../../../trail-boards.css">
<style>body{background:#f8f4ea;padding:24px}h1{font-size:24px;margin-bottom:20px}.gallery-face{position:relative;max-width:620px;width:100%;margin:auto}</style>
<main><h1>Local gallery test · sample illustrations, not event photos</h1>
<section class="trail-face gallery-face" data-trail-board="gallery" aria-labelledby="test-gallery-title"><h2 id="test-gallery-title">Test gallery</h2><p data-gallery-note></p><ul class="gallery-grid" data-gallery-grid></ul><div class="gallery-pagination" data-gallery-pagination hidden><button type="button" data-gallery-page="previous" aria-label="Previous gallery page">←</button><span data-gallery-page-label aria-live="polite"></span><button type="button" data-gallery-page="next" aria-label="Next gallery page">→</button></div></section></main>
<dialog class="gallery-dialog" data-gallery-dialog aria-labelledby="gallery-dialog-title"><div class="gallery-dialog-header"><h2 id="gallery-dialog-title">Test photo viewer</h2><button type="button" data-gallery-close aria-label="Close photo">✕</button></div><img class="gallery-dialog-image" data-gallery-large-image alt=""><p data-gallery-error hidden>This photo couldn’t load.</p><p class="gallery-dialog-caption" data-gallery-large-caption></p><div class="gallery-dialog-controls"><button type="button" data-gallery-photo="previous" aria-label="Previous photo">←</button><span data-gallery-photo-label></span><button type="button" data-gallery-photo="next" aria-label="Next photo">→</button></div></dialog>
<script type="module">import {configureGallery} from '../../../gallery.js';const files=['bit-master.webp','amp-master.webp','bite-master.webp','morganton-barn.webp','watts.webp','sphere-monument.webp'];configureGallery({gallery:files.map((file,i)=>({src:'/assets/hillside/'+file,alt:'Test illustration '+(i+1),caption:'Sample illustration '+(i+1)}))});</script>
</html>
